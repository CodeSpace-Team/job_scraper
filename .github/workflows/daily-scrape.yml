name: Daily Job Scraper

on:
  schedule:
    # 04:37 UTC = 06:37 South Africa. Deliberately not on the hour.
    #
    # GitHub queues scheduled workflows on a best-effort basis and delays them
    # under load, and the heaviest load is the top of every hour -- which is
    # exactly where '0 6 * * *' sat. Even on a good day it cost 34-50 minutes,
    # and twice it cost half a day:
    #
    #     23 Aug  08:34  (34m late)      27 Aug  19:16  (11h 16m late)
    #     24 Aug  08:50  (50m late)      28 Aug  20:08  (12h 08m late)
    #     25 Aug  08:39  (39m late)
    #     26 Aug  08:40  (40m late)
    #
    # An odd minute avoids the stampede, and starting earlier means an hour or
    # two of queueing still lands the run before the working day.
    #
    # This buys margin, not a guarantee. GitHub promises no accuracy on
    # schedules and may drop a scheduled run entirely. If the run ever has to
    # be reliably early, it needs an external trigger calling workflow_dispatch
    # rather than a cron in here.
    - cron: '37 4 * * *'

  workflow_dispatch:
    inputs:
      skip_linkedin:
        description: 'Skip LinkedIn scraping'
        required: false
        type: boolean
        default: true
      skip_enrichment:
        description: 'Skip AI enrichment'
        required: false
        type: boolean
        default: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install python-jobspy pandas requests anthropic gspread oauth2client beautifulsoup4 tls-client
      
      - name: Create data directory
        run: mkdir -p data/cache

      # ─── Debug: Check if GOOGLE_SHEETS_CREDS is set ────────────────────
      - name: Debug - Check Google Sheets credentials
        env:
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        run: |
          if [ -z "$GOOGLE_SHEETS_CREDS" ]; then
            echo "::error::GOOGLE_SHEETS_CREDS is empty or not set"
            exit 1
          else
            echo "✅ GOOGLE_SHEETS_CREDS is set (length: ${#GOOGLE_SHEETS_CREDS})"
          fi
      
      - name: Run scraping pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:."
          
          # ─── Build command from scratch ────────────────────────────────
          CMD="python -m src.main --spreadsheet-id $SPREADSHEET_ID"
          
          # Always skip LinkedIn and PNet
          CMD="$CMD --skip-linkedin --skip-pnet"
          
          # Enrichment on by default; skip only if manually requested
          if [ "${{ github.event.inputs.skip_enrichment }}" = "true" ]; then
            CMD="$CMD --skip-enrichment"
          fi
          
          # Manual override: allow LinkedIn only if explicitly requested
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.skip_linkedin }}" = "false" ]; then
            # Remove --skip-linkedin from the command
            CMD="${CMD/ --skip-linkedin/}"
            echo "Manual run: INCLUDING LinkedIn"
          fi
          
          echo "Running: $CMD"
          $CMD
      
      - name: Archive job data (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-data-${{ github.run_number }}
          path: |
            backend/data/cache/*.json
          retention-days: 7

      # ─── Publish the board (F6) ─────────────────────────────────────────
      # frontend/jobs.json is written by the pipeline regardless of whether
      # the Sheets write succeeded (see PHASE 3.7 in orchestrator.py), so
      # this runs even if an earlier step failed -- as long as the file
      # exists, the run produced something worth publishing. Committing it
      # here, rather than as part of the pipeline itself, keeps Python out
      # of the business of pushing to git.
      - name: Commit and push jobs.json to the board
        if: always()
        working-directory: .
        run: |
          if [ ! -f frontend/public/jobs.json ]; then
           echo "No frontend/public/jobs.json produced this run -- nothing to publish."
             exit 0
           fi

           git config user.name "github-actions[bot]"
           git config user.email "github-actions[bot]@users.noreply.github.com"
           git add frontend/public/jobs.json

          if git diff --cached --quiet; then
            echo "frontend/jobs.json is unchanged -- nothing to commit."
          else
            git commit -m "chore: publish today's jobs.json [skip ci]"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Job scraping pipeline failed. Check logs above."
          echo "Common issues:"
          echo "  - Rate limiting (especially LinkedIn)"
          echo "  - API credentials expired"
          echo "  - Source website changes"